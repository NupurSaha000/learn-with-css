<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div.relative {
  position: relative;
  width: 400px;
  height: 200px;
  left: 200px;
  border: 3px solid green;
} 

div.absolute {
  position: absolute;
  left: -205px;
  bottom: -106px;
  width: 200px;
  height: 100px;
  border: 3px solid red;
}

    </style>
</head>
<body>
        <h2>Using position relative & absolute</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Dignissimos, atque?</p>
        <div class="relative">This div element has position : relative ;
            <div class="absolute"></div>This div element has position: absolute ;
        </div>
        </div>
</body>
</html>
